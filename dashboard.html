<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Hostel Management System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="mobile-nav">
        <a href="dashboard.html" class="mobile-nav-link active">
            <i class="fas fa-th-large"></i>
            <span>Home</span>
        </a>
        <a href="rooms.html" class="mobile-nav-link">
            <i class="fas fa-door-open"></i>
            <span>Rooms</span>
        </a>
        <a href="allocation.html" class="mobile-nav-link">
            <i class="fas fa-user-plus"></i>
            <span>Alloc</span>
        </a>
        <a href="checkout.html" class="mobile-nav-link">
            <i class="fas fa-sign-out-alt"></i>
            <span>Exit</span>
        </a>
    </nav>

    <nav class="sidebar">
        <div class="logo">
            <i class="fas fa-hotel"></i>
            <span>HostelEase</span>
        </div>
        <ul class="nav-links">
            <li class="nav-item">
                <a href="dashboard.html" class="nav-link active">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="rooms.html" class="nav-link">
                    <i class="fas fa-door-open"></i>
                    <span>Rooms</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="allocation.html" class="nav-link">
                    <i class="fas fa-user-plus"></i>
                    <span>Allocation</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="checkout.html" class="nav-link">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Checkout</span>
                </a>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="fade-in">
            <h1>Dashboard Overview</h1>
            <p class="subtitle">Welcome back, Administrator</p>
        </header>

        <div class="dashboard-grid fade-in">
            <a href="rooms.html" class="glass-card stat-card interactive-card">
                <div class="icon-box" style="background: rgba(99, 102, 241, 0.1); color: var(--primary);">
                    <i class="fas fa-bed"></i>
                </div>
                <div class="stat-info">
                    <h3>Total Rooms</h3>
                    <div class="stat-value" id="stat-total-rooms">0</div>
                </div>
            </a>
            <a href="rooms.html" class="glass-card stat-card interactive-card">
                <div class="icon-box" style="background: rgba(34, 197, 94, 0.1); color: #22c55e;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-info">
                    <h3>Available</h3>
                    <div class="stat-value" id="stat-available">0</div>
                </div>
            </a>
            <a href="checkout.html" class="glass-card stat-card interactive-card">
                <div class="icon-box" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
                    <i class="fas fa-user-friends"></i>
                </div>
                <div class="stat-info">
                    <h3>Occupied</h3>
                    <div class="stat-value" id="stat-occupied">0</div>
                </div>
            </a>
            <a href="allocation.html" class="glass-card stat-card interactive-card">
                <div class="icon-box" style="background: rgba(6, 182, 212, 0.1); color: #06b6d4;">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-info">
                    <h3>Total Students</h3>
                    <div class="stat-value" id="stat-students">0</div>
                </div>
            </a>
        </div>

        <div class="glass-card fade-in" style="margin-top: 2rem;">
            <h2>Recent Activities</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Activity</th>
                            <th>Student</th>
                            <th>Room</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="recent-activities">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
