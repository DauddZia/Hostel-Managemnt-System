<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Allocation | Hostel Management System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="mobile-nav">
        <a href="dashboard.html" class="mobile-nav-link">
            <i class="fas fa-th-large"></i>
            <span>Home</span>
        </a>
        <a href="rooms.html" class="mobile-nav-link">
            <i class="fas fa-door-open"></i>
            <span>Rooms</span>
        </a>
        <a href="allocation.html" class="mobile-nav-link active">
            <i class="fas fa-user-plus"></i>
            <span>Alloc</span>
        </a>
        <a href="checkout.html" class="mobile-nav-link">
            <i class="fas fa-sign-out-alt"></i>
            <span>Exit</span>
        </a>
    </nav>

    <nav class="sidebar">
        <div class="logo">
            <i class="fas fa-hotel"></i>
            <span>HostelEase</span>
        </div>
        <ul class="nav-links">
            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="rooms.html" class="nav-link">
                    <i class="fas fa-door-open"></i>
                    <span>Rooms</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="allocation.html" class="nav-link active">
                    <i class="fas fa-user-plus"></i>
                    <span>Allocation</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="checkout.html" class="nav-link">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Checkout</span>
                </a>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="fade-in">
            <h1>Student Allocation</h1>
            <p class="subtitle">Assign a student to an available room</p>
        </header>

        <div class="glass-card fade-in" style="max-width: 600px; margin: 0 auto;">
            <h2 style="margin-bottom: 1.5rem;">New Allocation</h2>
            <form id="allocation-form" onsubmit="handleAllocation(event)">
                <div class="form-group">
                    <label for="student-select">Select Student</label>
                    <select id="student-select" onchange="toggleNewStudent(this.value)" required>
                        <!-- Populated by JS -->
                    </select>
                </div>
                <div class="form-group" id="new-student-container" style="display: none;">
                    <label for="new-student-name">Full Name of New Student</label>
                    <input type="text" id="new-student-name" placeholder="Enter student name">
                </div>
                <div class="form-group">
                    <label for="room-select">Select Available Room</label>
                    <select id="room-select" required>
                        <!-- Populated by JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="allocation-date">Allocation Date</label>
                    <input type="date" id="allocation-date" required value="2023-10-27">
                </div>
                <div class="form-group">
                    <label for="notes">Notes (Optional)</label>
                    <textarea id="notes" rows="3" placeholder="Additional details..."></textarea>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        Assign Room
                    </button>
                    <button type="reset" class="btn btn-outline" style="flex: 1;">
                        Reset
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
